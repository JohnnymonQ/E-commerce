spring:
  application:
    name: ecommerce
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        rewriteBatchedStatements: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100

app:
  import:
    batch-size: 500
